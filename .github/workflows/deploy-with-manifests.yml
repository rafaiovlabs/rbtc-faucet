name: Build and Deploy with K8s Manifests

on:
  push:
    branches:
      - main
      - develop
      - features/k8s-deployment
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: rbtc-faucet
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    permissions:
      id-token: write
      contents: read
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image-uri: ${{ steps.build-image.outputs.image }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.DEV_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
      run: |
        # Determine branch name for tagging
        BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
        
        # Build tags array
        TAGS="-t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_NAME-latest"
        
        # Add latest tag for main branch
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          TAGS="$TAGS -t $ECR_REGISTRY/$ECR_REPOSITORY:latest"
        fi
        
        # Build and push image with all tags using buildx
        docker buildx build --platform linux/amd64 --push $TAGS .
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    permissions:
      id-token: write
      contents: read
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.DEV_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Configure kubectl for EKS
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

    - name: Determine environment
      id: env
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "environment=prod" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
          echo "environment=dev" >> $GITHUB_OUTPUT
        else
          echo "environment=dev" >> $GITHUB_OUTPUT
        fi

    - name: Create namespace if not exists
      run: |
        kubectl create namespace rbtcfaucet-${{ steps.env.outputs.environment }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Substitute environment variables in manifests
      env:
        IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
        ENVIRONMENT: ${{ steps.env.outputs.environment }}
      run: |
        # Create a temporary directory for processed manifests
        mkdir -p k8s-processed
        
        # Process each manifest file
        for file in k8s/*.yaml; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            envsubst < "$file" > "k8s-processed/$filename"
          fi
        done
        
        # Show what we're about to apply
        echo "Processed manifests:"
        ls -la k8s-processed/
        
        echo "Content of deployment.yaml:"
        cat k8s-processed/deployment.yaml

    - name: Apply Deployment
      run: |
        if [ -f "k8s/deployment.yaml" ]; then
          kubectl apply -f k8s/deployment.yaml -n rbtcfaucet-${{ steps.env.outputs.environment }}
        fi

    - name: Wait for deployment to be ready
      run: |
        kubectl rollout restart deployment/rbtcfaucet -n rbtcfaucet-${{ steps.env.outputs.environment }}
        kubectl rollout status deployment/rbtcfaucet -n rbtcfaucet-${{ steps.env.outputs.environment }} --timeout=300s

    - name: Get deployment status
      run: |
        echo "=== Pods ==="
        kubectl get pods -n rbtcfaucet-${{ steps.env.outputs.environment }} 
        echo "=== Services ==="
        kubectl get services -n rbtcfaucet-${{ steps.env.outputs.environment }}
        echo "=== Ingress ==="
        kubectl get ingress -n rbtcfaucet-${{ steps.env.outputs.environment }}
        echo "=== Events ==="
        kubectl get events -n rbtcfaucet-${{ steps.env.outputs.environment }} --sort-by='.lastTimestamp' | tail -10

    - name: Verify deployment
      run: |
        echo "Deployment completed successfully!"
        echo "Image: ${{ needs.build-and-push.outputs.image-uri }}"
        echo "Environment: ${{ steps.env.outputs.environment }}"
        echo "Namespace: rbtcfaucet-${{ steps.env.outputs.environment }}"
