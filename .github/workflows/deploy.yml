name: Build and Deploy to ECR and Kubernetes

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - testing
          - qa
          - prod

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: rbtcfaucet-dev
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    permissions:
      id-token: write
      contents: read
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image-uri: ${{ steps.build-image.outputs.image }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
      with:
        role-to-assume: ${{ secrets.DEV_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
      run: |
        # Determine branch name for tagging
        BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
        
        # Build tags array
        TAGS="-t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_NAME-latest"
        
        # Add latest tag for main branch
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          TAGS="$TAGS -t $ECR_REGISTRY/$ECR_REPOSITORY:latest"
        fi
        
        # Build and push image with all tags using buildx
        docker buildx build --platform linux/amd64 --push $TAGS .
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    permissions:
      id-token: write
      contents: read
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment: dev
    needs: build-and-push    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
      with:
        role-to-assume: ${{ secrets.DEV_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Verify AWS authentication
      run: |
        echo "=== AWS Authentication Check ==="
        aws sts get-caller-identity
        echo "AWS CLI version: $(aws --version)"
        echo "AWS Region: ${{ env.AWS_REGION }}"
        echo "EKS Cluster: ${{ secrets.EKS_CLUSTER_NAME }}"

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Configure kubectl for EKS
      env:
        AWS_REGION: ${{ env.AWS_REGION }}
        EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      run: |
        echo "=== Configuring kubectl for EKS ==="
        echo "Region: $AWS_REGION"
        echo "Cluster: $EKS_CLUSTER_NAME"
         
        # Update kubeconfig
        aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME
        
        # The context name will be the cluster ARN, let's find it
        echo "=== Available contexts ==="
        kubectl config get-contexts
        
        echo "=== Current context ==="
        kubectl config current-context
        
        echo "=== Testing basic cluster connection ==="
        kubectl version --client
        kubectl cluster-info --request-timeout=5s || echo "⚠️ Cluster info failed - this is expected if RBAC is not configured"
        
        echo "=== Kubectl Configuration ==="
        kubectl config current-context
        kubectl config get-contexts
        
        echo "=== Testing cluster connection ==="
        kubectl version --client
        kubectl cluster-info --request-timeout=10s || echo "Cluster info failed"
        
        echo "=== Testing basic permissions ==="
        kubectl auth can-i get nodes || echo "Cannot get nodes"
        kubectl auth can-i get pods || echo "Cannot get pods"
        kubectl auth can-i create namespace || echo "Cannot create namespace"
        
        echo "=== Trying to list namespaces ==="
        kubectl get namespaces || echo "Cannot list namespaces"

    - name: Determine environment
      id: env
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "environment=prod" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
          echo "environment=dev" >> $GITHUB_OUTPUT
        else
          echo "environment=dev" >> $GITHUB_OUTPUT
        fi

    - name: Create namespace if not exists
      env:
        ENVIRONMENT: ${{ steps.env.outputs.environment }}
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name ${{ secrets.EKS_CLUSTER_NAME }}
        kubectl create namespace rbtc-faucet-${{ steps.env.outputs.environment }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Create or update deployment
      env:
        IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
        ENVIRONMENT: ${{ steps.env.outputs.environment }}
      run: |
        # Create deployment YAML
        cat <<EOF > deployment.yaml
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: rbtc-faucet
          namespace: rbtc-faucet-$ENVIRONMENT
          labels:
            app: rbtc-faucet
            environment: $ENVIRONMENT
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: rbtc-faucet
              environment: $ENVIRONMENT
          template:
            metadata:
              labels:
                app: rbtc-faucet
                environment: $ENVIRONMENT
            spec:
              containers:
              - name: rbtc-faucet
                image: $IMAGE_URI
                ports:
                - containerPort: 3000
                env:
                - name: NODE_ENV
                  value: "production"
                - name: ENVIRONMENT
                  value: "$ENVIRONMENT"
                resources:
                  requests:
                    memory: "256Mi"
                    cpu: "250m"
                  limits:
                    memory: "512Mi"
                    cpu: "500m"
                livenessProbe:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                readinessProbe:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 5
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: rbtc-faucet-service
          namespace: rbtc-faucet-$ENVIRONMENT
          labels:
            app: rbtc-faucet
            environment: $ENVIRONMENT
        spec:
          selector:
            app: rbtc-faucet
            environment: $ENVIRONMENT
          ports:
          - protocol: TCP
            port: 80
            targetPort: 3000
          type: ClusterIP
        ---
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: rbtc-faucet-ingress
          namespace: rbtc-faucet-$ENVIRONMENT
          labels:
            app: rbtc-faucet
            environment: $ENVIRONMENT
          annotations:
            kubernetes.io/ingress.class: "nginx"
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
        spec:
          tls:
          - hosts:
            - rbtc-faucet-$ENVIRONMENT.yourdomain.com
            secretName: rbtc-faucet-$ENVIRONMENT-tls
          rules:
          - host: rbtc-faucet-$ENVIRONMENT.yourdomain.com
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: rbtc-faucet-service
                    port:
                      number: 80
        EOF

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f deployment.yaml

    - name: Wait for deployment to be ready
      run: |
        kubectl rollout status deployment/rbtc-faucet -n rbtc-faucet-${{ steps.env.outputs.environment }} --timeout=300s

    - name: Get deployment status
      run: |
        kubectl get pods -n rbtc-faucet-${{ steps.env.outputs.environment }} -l app=rbtc-faucet
        kubectl get services -n rbtc-faucet-${{ steps.env.outputs.environment }}
        kubectl get ingress -n rbtc-faucet-${{ steps.env.outputs.environment }}

    - name: Verify deployment
      run: |
        echo "Deployment completed successfully!"
        echo "Image: ${{ needs.build-and-push.outputs.image-uri }}"
        echo "Environment: ${{ steps.env.outputs.environment }}"
        echo "Namespace: rbtc-faucet-${{ steps.env.outputs.environment }}"

    - name: Show IAM Role for EKS RBAC Configuration
      run: |
        echo "=== IAM Role Information for EKS RBAC ==="
        ROLE_ARN=$(aws sts get-caller-identity --query Arn --output text)
        echo "Current Role ARN: $ROLE_ARN"
        echo ""
        echo "⚠️ RBAC Configuration Required ⚠️"
        echo "The 'Unauthorized' error means your IAM role is not mapped in the EKS cluster."
        echo "You need to add this role to the aws-auth ConfigMap in your EKS cluster:"
        echo ""
        echo "1. Run this command on a machine with kubectl access to your cluster:"
        echo "   kubectl edit configmap aws-auth -n kube-system"
        echo ""
        echo "2. Add this under 'mapRoles:':"
        echo "   - rolearn: $ROLE_ARN"
        echo "     username: github-actions"
        echo "     groups:"
        echo "       - system:masters"
        echo ""
        echo "3. Or use eksctl:"
        echo "   eksctl create iamidentitymapping \\"
        echo "     --cluster $EKS_CLUSTER_NAME \\"
        echo "     --region $AWS_REGION \\"
        echo "     --arn $ROLE_ARN \\"
        echo "     --group system:masters \\"
        echo "     --username github-actions"
        echo ""
