apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbtc-faucet
  namespace: rbtc-faucet-${ENVIRONMENT}
  labels:
    app: rbtc-faucet
    environment: ${ENVIRONMENT}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rbtc-faucet
      environment: ${ENVIRONMENT}
  template:
    metadata:
      labels:
        app: rbtc-faucet
        environment: ${ENVIRONMENT}
    spec:
      containers:
      - name: rbtc-faucet
        image: ${IMAGE_URI}
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: ENVIRONMENT
          value: "${ENVIRONMENT}"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Add any secrets or config maps here
        # envFrom:
        # - secretRef:
        #     name: rbtc-faucet-secrets
        # - configMapRef:
        #     name: rbtc-faucet-config
